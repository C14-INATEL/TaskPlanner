
services:
  jenkins:
    build:
        context: ./jenkins
        dockerfile: Dockerfile
    container_name: jenkins-taskplanner
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo

volumes:
  jenkins_home:
